function scrollToToday(root,R){
  const gr=$("#gr",root)||$("#gr");
  if(!gr) return;
  const x=((new Date()-R.start)/DAY)/7*COL;
  gr.scrollTo({left:Math.max(0,x-gr.clientWidth*0.35),behavior:"smooth"});
}
function drawGantt(host,p){
  if(!S.tasks.length){
    host.innerHTML='<div class="card"><div class="empty"><div class="big">Cronoprogramma vuoto</div>'+
      'Aggiungi le voci del cantiere oppure carica il cronoprogramma tipo.'+
      (canWrite()?'<div style="margin-top:14px"><button class="btn btn-pri" id="g_tpl">Carica cronoprogramma tipo</button></div>':'')+
      '</div></div>';
    const t=$("#g_tpl",host);
    if(t) t.addEventListener("click",async()=>{ t.disabled=true;t.textContent="Creazione…";
      await seedTemplate(p.id,p.ganttStart||p.startDate); await loadProjectData(p.id); render(); toast("Cronoprogramma creato") });
    return;
  }
  const R=ganttRange(S.tasks,p);
  const W=R.weeks*COL;
  let mon="",wk="",grid="";
  let i=0;
  while(i<R.weeks){
    const d=addD(R.start,i*7); const mo=d.getMonth(); let span=0;
    while(i+span<R.weeks && addD(R.start,(i+span)*7).getMonth()===mo) span++;
    mon+='<div style="width:'+(span*COL)+'px">'+esc(MESI[mo].slice(0,3).toUpperCase()+" "+String(d.getFullYear()).slice(2))+'</div>';
    i+=span;
  }
  for(let w=0;w<R.weeks;w++){
    const d=addD(R.start,w*7);
    const first=d.getDate()<=7;
    wk+='<div class="'+(first?"m0":"")+'" style="width:'+COL+'px">'+d.getDate()+'</div>';
    grid+='<span class="'+(first?"m0":"")+'" style="left:'+(w*COL)+'px"></span>';
  }
  const todayX=((new Date()-R.start)/DAY)/7*COL;
  const rows=S.tasks.map((t,idx)=>ganttRow(t,idx,R,W,grid)).join("");
  host.innerHTML='<div class="gantt"><div class="g-scroll">'+
    '<div class="g-left"><div class="g-rowh"><div class="g-lh"><span class="eyebrow" style="flex:1">Voce</span>'+
      '<span class="eyebrow" style="width:52px;text-align:center">Sett.</span><span class="eyebrow" style="width:38px;text-align:right">%</span></div></div>'+
      S.tasks.map((t,idx)=>ganttLeft(t,idx)).join("")+'</div>'+
    '<div class="g-right" id="gr"><div style="width:'+W+'px">'+
      '<div class="g-rowh" style="flex-direction:column;align-items:stretch;position:relative">'+
        '<div class="g-mon">'+mon+'</div><div class="g-wk">'+wk+'</div></div>'+
      '<div style="position:relative">'+rows+
        (todayX>=0&&todayX<=W?'<div class="g-today" style="left:'+todayX+'px;top:0;bottom:0"></div>':'')+
      '</div></div></div></div>'+
    '<div class="legend">'+CATS.filter(c=>S.tasks.some(t=>t.cat===c.k)).map(c=>
      '<span class="li"><span class="sw" style="background:'+c.c+'"></span>'+esc(c.n)+'</span>').join("")+
    '<span class="li" style="margin-left:auto"><span class="sw" style="background:var(--accent)"></span>Oggi</span></div></div>';
  bindGanttRows(host,R,W,p);
}
function ganttLeft(t){
  const tap=canWrite()?' data-ed="'+t.id+'" style="cursor:pointer"':'';
  if(t.group) return '<div class="g-row grp"><div class="g-li"><span class="nm gp"'+tap+'>'+esc(t.name)+'</span>'+
    (canWrite()?'<span class="hnd"><button class="btn btn-xs" data-ed="'+t.id+'">'+IC.pen+'</button>'+
    '<button class="btn btn-xs" data-rm="'+t.id+'">'+IC.trash+'</button></span>':'')+'</div></div>';
  const wkn=t.start&&t.end?Math.max(1,weeksBetween(t.start,t.end)+1):0;
  const sub=canF("g_resp")&&t.resp?t.resp:"";
  return '<div class="g-row"><div class="g-li">'+
    '<span style="width:8px;height:8px;border-radius:2px;background:'+catOf(t.cat).c+';flex:none"></span>'+
    '<span class="nm"'+tap+' title="'+esc(t.name)+(sub?" · "+esc(sub):"")+'">'+esc(t.name)+
      (sub?'<span class="dim" style="font-weight:500"> · '+esc(sub)+'</span>':'')+'</span>'+
    (canWrite()?'<span class="hnd"><button class="btn btn-xs" data-ed="'+t.id+'">'+IC.pen+'</button>'+
      '<button class="btn btn-xs" data-rm="'+t.id+'">'+IC.trash+'</button></span>':'')+
    '<span class="wk" style="width:52px;text-align:center">'+wkn+'</span>'+
    '<span class="pg">'+Math.round(N(t.progress))+'</span></div></div>';
}
function taskModal(t,isGroup){
  const p=P(); const isNew=!t;
  const b=el("div");
  if(isGroup){
    b.innerHTML=fld("t_name","Nome gruppo (es. LAVORI)","text",t?t.name:"");
  }else{
    const wkn=t&&t.start&&t.end?Math.max(1,weeksBetween(t.start,t.end)+1):4;
    const catOpts=CATS.map(c=>[c.k,c.n]).concat([["__new","+ Nuova categoria…"]]);
    b.innerHTML=fld("t_name","Voce / lavorazione","text",t?t.name:"")+
      '<div class="f2">'+sel("t_cat","Categoria",t?t.cat:"altro",catOpts)+
        fld("t_resp","Impresa / responsabile","text",t?t.resp:"")+'</div>'+
      '<div class="f2 hide" id="t_newcat_w">'+fld("t_newcat","Nome nuova categoria","text","")+
        '<div class="field"><label for="t_newcol">Colore</label><input class="inp" type="color" id="t_newcol" value="#C4712B" style="height:40px;padding:4px"></div></div>'+
      '<div class="f3">'+fld("t_start","Inizio","date",t?t.start:iso(monday(pd(p&&p.ganttStart)||new Date())))+
        fld("t_end","Fine","date",t?t.end:iso(addD(monday(pd(p&&p.ganttStart)||new Date()),wkn*7-1)))+
        fld("t_pg","Avanzamento %","number",t?Math.round(N(t.progress)):0,'min="0" max="100" step="5"')+'</div>'+
      fld("t_note","Note","textarea",t?t.note:"");
    const cs=$("#t_cat",b);
    cs.addEventListener("change",()=>$("#t_newcat_w",b).classList.toggle("hide",cs.value!=="__new"));
  }
  modal({title:isNew?(isGroup?"Nuovo gruppo":"Nuova voce"):(isGroup?"Modifica gruppo":"Modifica voce"),body:b,
    ok:isNew?"Aggiungi":"Salva",
    danger:isNew?null:"Elimina",
    onDelete:async()=>{ await del(ppath("tasks/"+t.id)); await loadProjectData(S.pid); await syncProgress(P()); render(); toast("Eliminato"); return true },
    onOk:async(body)=>{
      const name=$("#t_name",body).value.trim();
      if(!name){toast("Inserisci un nome",true);return false}
      let data;
      if(isGroup){ data={name:name,group:true,cat:"altro",progress:0} }
      else{
        const st=$("#t_start",body).value, en=$("#t_end",body).value;
        if(!st||!en){toast("Inserisci le date",true);return false}
        if(en<st){toast("La data di fine precede l'inizio",true);return false}
        let cat=$("#t_cat",body).value;
        if(cat==="__new"){
          const nm=$("#t_newcat",body).value.trim();
          if(!nm){toast("Dai un nome alla categoria",true);return false}
          const key="cc_"+nm.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,16)+Math.random().toString(36).slice(2,5);
          const cc=(p.customCats||[]).concat([{k:key,n:nm,c:$("#t_newcol",body).value}]);
          p.customCats=cc; await patch("projects/"+p.id,{customCats:cc}); applyCustomCats(p); cat=key;
        }
        data={name:name,group:false,cat:cat,resp:$("#t_resp",body).value.trim(),
          start:st,end:en,progress:clamp(N($("#t_pg",body).value),0,100),note:$("#t_note",body).value.trim()};
      }
      if(isNew){ data.order=(S.tasks.reduce((m,x)=>Math.max(m,N(x.order)),0))+1;
        if(!await put(ppath("tasks/"+uid("t")),data)) return false }
      else { if(!await patch(ppath("tasks/"+t.id),data)) return false }
      await loadProjectData(S.pid); await syncProgress(P()); render(); toast(isNew?"Voce aggiunta":"Voce aggiornata");
      return true;
    }});
}

/* ---------- Timeline pagamenti ---------- */
function drawPayGantt(host,p){
  if(!S.plan.length){
    host.innerHTML='<div class="empty"><div class="big">Nessun pagamento pianificato</div>'+
      'Aggiungi le uscite previste e vedrai la timeline di cassa settimana per settimana.'+
      (canWrite()?'<div style="margin-top:14px"><button class="btn btn-pri" id="pl_add0">'+IC.plus+'Aggiungi pagamento previsto</button></div>':'')+'</div>';
    const b=$("#pl_add0",host); if(b) b.addEventListener("click",()=>planModal(null));
    return;
  }
  const R=ganttRange(S.tasks,p);
  const W=R.weeks*COL;
  let mon="",wk="",grid="";
  const weekly=new Array(R.weeks).fill(0);
  S.plan.forEach(it=>{ const w=weeksBetween(R.start,pd(it.date)||R.start); if(w>=0&&w<R.weeks) weekly[w]+=N(it.amount) });
  const maxW=Math.max.apply(null,weekly.concat([1]));
  const monthly=[];
  let i=0;
  while(i<R.weeks){
    const d=addD(R.start,i*7); const mo=d.getMonth(); let span=0,sum=0;
    while(i+span<R.weeks && addD(R.start,(i+span)*7).getMonth()===mo){ sum+=weekly[i+span]; span++ }
    mon+='<div style="width:'+(span*COL)+'px">'+esc(MESI[mo].slice(0,3).toUpperCase()+" "+String(d.getFullYear()).slice(2))+'</div>';
    monthly.push({span:span,sum:sum});
    i+=span;
  }
  for(let w=0;w<R.weeks;w++){
    const d=addD(R.start,w*7); const first=d.getDate()<=7;
    wk+='<div class="'+(first?"m0":"")+'" style="width:'+COL+'px">'+d.getDate()+'</div>';
    grid+='<span class="'+(first?"m0":"")+'" style="left:'+(w*COL)+'px"></span>';
  }
  const todayX=((new Date()-R.start)/DAY)/7*COL;
  const rows=S.plan.map(it=>{
    const w=weeksBetween(R.start,pd(it.date)||R.start);
    const x=clamp(w,0,R.weeks-1)*COL;
    const span=Math.max(1,N(it.weeks)||1);
    const c=it.status==="pagato"?"#3C7A57":it.status==="confermato"?"#C4712B":"#6E7D8C";
    return '<div class="g-row" style="width:'+W+'px"><div class="g-track" style="width:'+W+'px">'+
      '<div class="g-grid">'+grid+'</div>'+
      '<div class="pay-bar'+(it.status==="pagato"?" done":"")+'" data-pb="'+it.id+'" style="left:'+x+'px;width:'+
      Math.max(46,span*COL)+'px;background:'+c+'">'+esc(eur0(it.amount))+'</div></div></div>';
  }).join("");
  host.innerHTML='<div class="gantt" style="border:0;border-radius:0;box-shadow:none"><div class="g-scroll">'+
    '<div class="g-left"><div class="g-rowh"><div class="g-lh"><span class="eyebrow" style="flex:1">Uscita prevista</span>'+
      '<span class="eyebrow" style="width:64px;text-align:right">Importo</span></div></div>'+
      S.plan.map(it=>{
        const who=(p.partners||[]).find(x=>x.id===it.paidBy);
        return '<div class="g-row"><div class="g-li">'+
        '<span style="width:8px;height:8px;border-radius:2px;background:'+
          (it.status==="pagato"?"#3C7A57":it.status==="confermato"?"#C4712B":"#6E7D8C")+';flex:none"></span>'+
        '<span class="nm"'+(canWrite()?' data-pe="'+it.id+'" style="cursor:pointer"':'')+' title="'+esc((it.label||"")+" · "+(it.supplier||""))+'">'+esc(it.label||it.supplier||"Pagamento")+
          (it.supplier?'<span class="dim" style="font-weight:500"> · '+esc(it.supplier)+'</span>':'')+
          (who?'<span class="dim" style="font-weight:500"> · '+esc(who.name)+'</span>':'')+'</span>'+
        (canWrite()?'<span class="hnd"><button class="btn btn-xs" data-pe="'+it.id+'">'+IC.pen+'</button>'+
          '<button class="btn btn-xs" data-pd="'+it.id+'">'+IC.trash+'</button></span>':'')+
        '<span class="wk" style="width:64px;text-align:right;font-weight:700;color:var(--ink)">'+eur0(it.amount)+'</span></div></div>'}).join("")+
      '<div class="g-row" style="height:66px;background:var(--surface-2)"><div class="wk-lbl">'+
        '<div><div class="eyebrow">Cassa per settimana</div>'+
        '<div class="mono" style="font-size:11px;color:var(--ink-3)">picco '+eur0(maxW)+'</div></div></div></div>'+
      '<div class="g-row grp"><div class="g-li"><span class="nm gp">Totale mese</span></div></div>'+
    '</div>'+
    '<div class="g-right" id="gr"><div style="width:'+W+'px">'+
      '<div class="g-rowh" style="flex-direction:column;align-items:stretch;position:relative">'+
        '<div class="g-mon">'+mon+'</div><div class="g-wk">'+wk+'</div></div>'+
      '<div style="position:relative">'+rows+
        '<div class="wk-tot">'+weekly.map(v=>'<div style="width:'+COL+'px" title="'+esc(eur0(v))+'">'+
          (v>0?'<i style="height:'+clamp(v/maxW*44,4,44)+'px"></i>':'')+'</div>').join("")+'</div>'+
        '<div class="g-mon" style="height:30px;border-bottom:1px solid var(--line-2)">'+monthly.map(mm=>
          '<div style="width:'+(mm.span*COL)+'px;justify-content:flex-start;color:'+(mm.sum?"var(--ink)":"var(--ink-4)")+
          ';font-family:var(--fm);letter-spacing:0;text-transform:none;font-size:10.5px">'+(mm.sum?eur0(mm.sum):"—")+'</div>').join("")+'</div>'+
        (todayX>=0&&todayX<=W?'<div class="g-today" style="left:'+todayX+'px;top:0;bottom:0"></div>':'')+
      '</div></div></div></div>'+
    '<div class="legend"><span class="li"><span class="sw" style="background:#6E7D8C"></span>Previsto</span>'+
    '<span class="li"><span class="sw" style="background:#C4712B"></span>Confermato</span>'+
    '<span class="li"><span class="sw" style="background:#3C7A57"></span>Pagato</span>'+
    '<span class="li" style="margin-left:auto">Trascina una barra per spostare la settimana di pagamento</span></div></div>';
  $$("[data-pe]",host).forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
    const it=S.plan.find(x=>x.id===b.dataset.pe); if(it) planModal(it)}));
  $$("[data-pd]",host).forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
    const it=S.plan.find(x=>x.id===b.dataset.pd); if(!it)return;
    confirmBox("Elimina pagamento previsto","Eliminare «"+(it.label||it.supplier||"voce")+"» ("+eur0(it.amount)+")?","Elimina",async()=>{
      await del(ppath("plan/"+it.id)); await loadProjectData(S.pid); render(); toast("Voce eliminata")})}));
  if(!canWrite()) return;
  $$(".pay-bar",host).forEach(bar=>{
    const it=S.plan.find(x=>x.id===bar.dataset.pb); if(!it) return;
    let on=false,sx=0,ox=0,moved=false;
    bar.addEventListener("pointerdown",ev=>{ if(ev.button!=null&&ev.button!==0)return;
      on=true;sx=ev.clientX;ox=parseFloat(bar.style.left);moved=false;bar.classList.add("drag");
      bar.setPointerCapture&&bar.setPointerCapture(ev.pointerId);ev.preventDefault() });
    bar.addEventListener("pointermove",ev=>{ if(!on)return;
      const dx=ev.clientX-sx; if(Math.abs(dx)>3) moved=true;
      bar.style.left=Math.max(0,ox+Math.round(dx/COL)*COL)+"px" });
    bar.addEventListener("pointerup",async()=>{
      if(!on)return; on=false;bar.classList.remove("drag");
      if(!moved) return;
      const w=Math.round(parseFloat(bar.style.left)/COL);
      const nd=iso(addD(R.start,w*7));
      it.date=nd; await patch(ppath("plan/"+it.id),{date:nd});
      render(); toast((it.label||"Pagamento")+" → settimana del "+fmtD(nd));
    });
    bar.addEventListener("pointercancel",()=>{on=false;bar.classList.remove("drag")});
    bar.addEventListener("dblclick",()=>planModal(it));
  });
}

      '<span class="t">Segna come pagato e registralo nei pagamenti effettuati</span></label>':'');
  modal({title:isNew?"Nuovo pagamento previsto":"Modifica pagamento previsto",wide:true,body:b,ok:isNew?"Aggiungi al piano":"Salva",
    danger:isNew?null:"Elimina",
    onDelete:async()=>{ await del(ppath("plan/"+it.id)); await loadProjectData(S.pid); render(); toast("Eliminato"); return true },

        date:iso(monday(pd($("#q_date",body).value)||new Date())),weeks:clamp(N($("#q_wk",body).value)||1,1,26),
        status:mk?"pagato":$("#q_st",body).value,paidBy:$("#q_by",body)?$("#q_by",body).value:"",
        cat:$("#q_cat",body).value,note:$("#q_note",body).value.trim()};
      const ok=isNew?await put(ppath("plan/"+uid("q")),data):await patch(ppath("plan/"+it.id),data);
      if(!ok) return false;
      if(mk){
        await put(ppath("fin/"+uid("f")),{kind:"payment",supplier:data.supplier,desc:data.label||"Pagamento da piano",
          amount:amt,date:iso(new Date()),method:"bonifico",paidBy:data.paidBy,cat:data.cat,by:S.me.id});
      }
      await loadProjectData(S.pid); render(); toast(isNew?"Pagamento pianificato":"Piano aggiornato"); return true;
    }});
}

/* ---------- 1. MAIUSCOLO automatico su tutti i campi di testo ---------- */
function upcaseTarget(t){
  if(!t||t.tagName!=="INPUT") return;
  if(t.type!=="text") return;
  if(t.hasAttribute("data-nocase")) return;
  const v=t.value, u=v.toUpperCase();
  if(v===u) return;
  const a=t.selectionStart, b=t.selectionEnd;
  t.value=u;
  try{ t.setSelectionRange(a,b) }catch(e){}
}
document.addEventListener("input",e=>upcaseTarget(e.target),true);
document.addEventListener("change",e=>upcaseTarget(e.target),true);

/* ---------- 4/5. IVA ---------- */
const IVA_RATES=[4,10,22];
function vatRate(){ const p=P(); return N(p&&p.ivaRate)||22 }
function vatOn(){ if(S.view!=="project") return false; const p=P(); if(!p) return false;
  return lsGet("repjt.vat."+p.id)==="1" }
function vatSet(v){ const p=P(); if(p) lsSet("repjt.vat."+p.id,v?"1":"0") }
function vatK(){ return vatOn()?1+vatRate()/100:1 }
const VE=v=>eur0(N(v)*vatK());
const eurN=v=>eur(v,0);
function vatCalc(p,m){
  const r=N(p.ivaRate)||22;
  const base=N(m.works)+N(m.other)+N(m.fee)+(p.ivaOnPurchase?N(m.buy):0);
  const credit=base*r/100;
  return {rate:r,base:base,credit:credit,
    rows:IVA_RATES.map(x=>{ const debit=N(m.rev)*x/100; return {rate:x,debit:debit,net:debit-credit} })};
}

/* ---------- 2. Restyling Gantt: bande mensili, barre, totali ---------- */
function ganttLayers(R,W){
  let mon="",wk="",bands="",lines="";
  let i=0,mi=0;
  const months=[];
  while(i<R.weeks){
    const d=addD(R.start,i*7); const mo=d.getMonth(); let span=0;
    while(i+span<R.weeks && addD(R.start,(i+span)*7).getMonth()===mo) span++;
    const lab=span>=2?(MESI[mo].slice(0,3).toUpperCase()+" "+String(d.getFullYear()).slice(2)):"";
    mon+='<div style="width:'+(span*COL)+'px">'+esc(lab)+'</div>';
    if(mi%2===1) bands+='<span class="mband" style="left:'+(i*COL)+'px;width:'+(span*COL)+'px"></span>';
    months.push({idx:i,span:span,mo:mo,year:d.getFullYear()});
    i+=span; mi++;
  }
  for(let w=0;w<R.weeks;w++){
    const d=addD(R.start,w*7);
    const first=d.getDate()<=7;
    wk+='<div class="'+(first?"m0":"")+'" style="width:'+COL+'px">'+d.getDate()+'</div>';
    lines+='<span class="'+(first?"m0":"")+'" style="left:'+(w*COL)+'px"></span>';
  }
  void W;
  return {mon:mon,wk:wk,grid:bands+lines,bands:bands,months:months};
}
function ganttRow(t,idx,R,W,grid){
  const isG=t.group;
  let bar="";
  if(t.start&&t.end){
    const x=((pd(t.start)-R.start)/DAY)/7*COL;
    const w=Math.max(COL*0.7,(((pd(t.end)-pd(t.start))/DAY)+1)/7*COL);
    const c=catOf(t.cat).c; const pg=clamp(N(t.progress),0,100);
    bar='<div class="g-bar'+(isG?" gp":"")+(!isG&&w>118?" haspg":"")+'" data-bar="'+t.id+'" title="'+esc(t.name+"  ·  "+fmtD(t.start)+" → "+fmtD(t.end)+"  ·  "+Math.round(pg)+"%")+
      '" style="left:'+x+'px;width:'+w+'px;background-color:'+c+'">'+
      (pg>0?'<span class="fill" style="width:'+pg+'%"></span>':'')+
      '<span class="lab">'+esc(t.name)+'</span>'+
      (!isG&&w>118?'<span class="pgn">'+Math.round(pg)+'%</span>':'')+
      (canWrite()&&!isG?'<span class="rz l"></span><span class="rz r"></span>':'')+'</div>';
  }
  void idx;
  return '<div class="g-row'+(isG?" grp":"")+'" style="width:'+W+'px"><div class="g-track" style="width:'+W+'px">'+
    '<div class="g-grid">'+grid+'</div>'+bar+'</div></div>';
}

}
function drawPayGantt(host,p){
  if(!S.plan.length){
    host.innerHTML='<div class="empty"><div class="big">Nessun pagamento pianificato</div>'+
      'Aggiungi le uscite previste e vedrai la timeline di cassa settimana per settimana.'+
      (canWrite()?'<div style="margin-top:14px"><button class="btn btn-pri" id="pl_add0">'+IC.plus+'Aggiungi pagamento previsto</button></div>':'')+'</div>';
    const b=$("#pl_add0",host); if(b) b.addEventListener("click",()=>planModal(null));
    return;
  }
  const R=ganttRange(S.tasks,p);
  const W=R.weeks*COL;
  const L=ganttLayers(R,W);
  const weekly=new Array(R.weeks).fill(0);
  S.plan.forEach(it=>{ const w=weeksBetween(R.start,pd(it.date)||R.start); if(w>=0&&w<R.weeks) weekly[w]+=N(it.amount) });
  const maxW=Math.max.apply(null,weekly.concat([1]));
  const monTot=L.months.map(mm=>{ let s=0; for(let k=mm.idx;k<mm.idx+mm.span;k++) s+=weekly[k]||0; return {span:mm.span,sum:s} });
  const todayX=((new Date()-R.start)/DAY)/7*COL;
  const col=it=>it.status==="pagato"?"#3C7A57":it.status==="confermato"?"#C4712B":"#6E7D8C";
  const rows=S.plan.map(it=>{
    const w=weeksBetween(R.start,pd(it.date)||R.start);
    const x=clamp(w,0,R.weeks-1)*COL;
    const span=Math.max(1,N(it.weeks)||1);
    return '<div class="g-row" style="width:'+W+'px"><div class="g-track" style="width:'+W+'px">'+
      '<div class="g-grid">'+L.grid+'</div>'+
      '<div class="pay-bar'+(it.status==="pagato"?" done":"")+'" data-pb="'+it.id+
      '" style="left:'+x+'px;width:'+Math.max(74,span*COL)+'px;background-color:'+col(it)+'">'+
      '<span class="pd"></span><span>'+esc(VE(it.amount))+'</span></div></div></div>';
  }).join("");
  host.innerHTML='<div class="gantt" style="border:0;border-radius:0;box-shadow:none"><div class="g-scroll">'+
    '<div class="g-left"><div class="g-rowh"><div class="g-lh"><span class="eyebrow" style="flex:1">Uscita prevista</span>'+
      '<span class="eyebrow" style="width:70px;text-align:right">Importo</span></div></div>'+
      S.plan.map(it=>{
        const who=(p.partners||[]).find(x=>x.id===it.paidBy);
        return '<div class="g-row"><div class="g-li">'+
        '<span style="width:8px;height:8px;border-radius:50%;background:'+col(it)+';flex:none"></span>'+
        '<span class="nm"'+(canWrite()?' data-pe="'+it.id+'" style="cursor:pointer"':'')+' title="'+
          esc((it.label||"")+(it.supplier?" · "+it.supplier:""))+'">'+esc(it.label||it.supplier||"Pagamento")+
          (it.supplier?'<span class="dim" style="font-weight:500"> · '+esc(it.supplier)+'</span>':'')+
          (who?'<span class="dim" style="font-weight:500"> · '+esc(who.name)+'</span>':'')+'</span>'+
        (canWrite()?'<span class="hnd"><button class="btn btn-xs" data-pe="'+it.id+'">'+IC.pen+'</button>'+
          '<button class="btn btn-xs" data-pd="'+it.id+'">'+IC.trash+'</button></span>':'')+
        '<span class="wk" style="width:70px;text-align:right;font-weight:700;color:var(--ink);display:block">'+VE(it.amount)+'</span></div></div>'}).join("")+
      (canWrite()?'<div class="g-addrow"><button type="button" id="pl_addrow">'+IC.plus+'Aggiungi pagamento</button></div>':'')+
      '<div class="g-row" style="height:58px;background:var(--surface-2);border-bottom:0"><div class="wk-lbl">'+
        '<div><div class="eyebrow">Cassa per settimana</div>'+
        '<div class="mono" style="font-size:10.5px;color:var(--ink-3)">picco '+VE(maxW)+'</div></div></div></div>'+
      '<div class="g-row" style="height:32px;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)">'+
        '<div class="g-li"><span class="nm gp" style="font-size:9.5px">Totale mese</span></div></div>'+
    '</div>'+
    '<div class="g-right" id="gr"><div style="width:'+W+'px">'+
      '<div class="g-rowh" style="flex-direction:column;align-items:stretch;position:relative">'+
        '<div class="g-mon">'+L.mon+'</div><div class="g-wk" style="position:relative">'+
        '<div class="g-grid">'+L.bands+'</div>'+L.wk+'</div></div>'+
      '<div style="position:relative">'+rows+
        (canWrite()?'<div class="g-row" style="width:'+W+'px"><div class="g-track" style="width:'+W+'px"><div class="g-grid">'+L.grid+'</div></div></div>':'')+
        '<div class="wk-tot">'+weekly.map((v,i)=>'<div style="width:'+COL+'px" title="'+
          esc(fmtD(iso(addD(R.start,i*7)))+" · "+VE(v))+'">'+
          (v>0?'<i style="height:'+clamp(v/maxW*42,4,42)+'px"></i>':'')+'</div>').join("")+'</div>'+
        '<div class="mon-tot">'+monTot.map(mm=>'<div style="width:'+(mm.span*COL)+'px;color:'+
          (mm.sum?"var(--ink)":"var(--ink-4)")+'">'+(mm.sum?VE(mm.sum):"—")+'</div>').join("")+'</div>'+
        (todayX>=0&&todayX<=W?'<div class="g-today" style="left:'+todayX+'px;top:0;bottom:0"></div>':'')+
      '</div></div></div></div>'+
    '<div class="legend"><span class="li"><span class="sw" style="background:#6E7D8C"></span>Previsto</span>'+
    '<span class="li"><span class="sw" style="background:#C4712B"></span>Confermato</span>'+
    '<span class="li"><span class="sw" style="background:#3C7A57"></span>Pagato</span>'+
    '<span class="li" style="margin-left:auto">Trascina una barra per spostare la settimana di pagamento</span></div></div>';
  keepScroll(host,"pay",R);
  bindPayTips(host,R,p);
  const ar=$("#pl_addrow",host); if(ar) ar.addEventListener("click",()=>planModal(null));
  $$("[data-pe]",host).forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
    const it=S.plan.find(x=>x.id===b.dataset.pe); if(it) planModal(it)}));
  $$("[data-pd]",host).forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
    const it=S.plan.find(x=>x.id===b.dataset.pd); if(!it)return;
    confirmBox("Elimina pagamento previsto","Eliminare «"+(it.label||it.supplier||"voce")+"» ("+VE(it.amount)+")?","Elimina",async()=>{
      await del(ppath("plan/"+it.id)); await loadProjectData(S.pid); render(); toast("Voce eliminata")})}));
  if(!canWrite()) return;
  $$(".pay-bar",host).forEach(bar=>{
    const it=S.plan.find(x=>x.id===bar.dataset.pb); if(!it) return;
    let on=false,sx=0,ox=0,moved=false;
    bar.addEventListener("pointerdown",ev=>{ if(ev.button!=null&&ev.button!==0)return;
      on=true;sx=ev.clientX;ox=parseFloat(bar.style.left);moved=false;bar.classList.add("drag");
      bar.setPointerCapture&&bar.setPointerCapture(ev.pointerId);ev.preventDefault() });
    bar.addEventListener("pointermove",ev=>{ if(!on)return;
      const dx=ev.clientX-sx; if(Math.abs(dx)>3) moved=true;
      bar.style.left=Math.max(0,ox+Math.round(dx/COL)*COL)+"px" });
    bar.addEventListener("pointerup",async()=>{
      if(!on)return; on=false;bar.classList.remove("drag");
      if(!moved) return;
      const w=Math.round(parseFloat(bar.style.left)/COL);
      const nd=iso(addD(R.start,w*7));
      it.date=nd; await patch(ppath("plan/"+it.id),{date:nd});
      render(); toast((it.label||"Pagamento")+" → settimana del "+fmtD(nd));
    });
    bar.addEventListener("pointercancel",()=>{on=false;bar.classList.remove("drag")});
    bar.addEventListener("dblclick",()=>planModal(it));
  });
}

function allFolders(){
  const set={};
  DEFAULT_FOLDERS.forEach(f=>set[f]=1);
  S.projects.forEach(p=>(p.folders||[]).forEach(f=>set[f]=1));
  return Object.keys(set).sort((a,b)=>a.localeCompare(b));
}
function canFolder(name){
  if(isMaster()) return true;
  const f=S.me&&S.me.perms&&S.me.perms.folders;
  if(!f||f==="all") return true;
  return f.indexOf(name)>=0;
}

/* ---------- 6. pagamenti: ripartizione tra soci ---------- */
function paidSplit(f){
  if(f&&Array.isArray(f.paidByList)&&f.paidByList.length)
    return f.paidByList.map(x=>({id:x.id,amount:N(x.amount)})).filter(x=>x.id);
  if(f&&f.paidBy) return [{id:f.paidBy,amount:N(f.amount)}];
  return [];
}
function paidByOf(f,id){ let s=0; paidSplit(f).forEach(x=>{ if(x.id===id) s+=x.amount }); return s }
function payerChips(f,p){
  const sp=paidSplit(f);
  if(!sp.length) return '<span class="dim">—</span>';
  const parts=(p&&p.partners)||[];
  if(sp.length>2) return '<span class="chip acc">'+sp.length+' soci</span>';
  return sp.map(x=>{ const w=parts.find(z=>z.id===x.id);
    return '<span class="chip acc" style="margin-right:3px">'+esc(w?w.name:"—")+
      (sp.length>1?' <span style="opacity:.75">'+VE(x.amount)+'</span>':'')+'</span>' }).join("");
}
function ledgerBalances(p,fin,ledger){
  const partners=(p.partners||[]);
  const map={}; partners.forEach(x=>map[x.id]={id:x.id,name:x.name,quota:N(x.quota),paid:0,manual:0});
  (fin||[]).filter(f=>f.kind==="payment").forEach(f=>{
    paidSplit(f).forEach(x=>{ if(map[x.id]) map[x.id].paid+=N(x.amount) });
  });
  (ledger||[]).forEach(l=>{
    if(l.from&&map[l.from]) map[l.from].manual+=N(l.amount);
    if(l.to&&map[l.to]) map[l.to].manual-=N(l.amount);
  });
  const totalPaid=Object.values(map).reduce((s,x)=>s+x.paid,0);
  const qSum=Object.values(map).reduce((s,x)=>s+x.quota,0)||100;
  Object.values(map).forEach(x=>{ x.due=totalPaid*(x.quota/qSum); x.balance=x.paid-x.due+x.manual });
  return {rows:Object.values(map),totalPaid:totalPaid,quotaSum:qSum};
}
function finModal(f,kind){
  const p=P(); const isNew=!f; const isReq=kind==="request";
  const parts=(p.partners||[]);
  const qSum=parts.reduce((s,x)=>s+N(x.quota),0)||100;
  const openPlan=S.plan.filter(x=>x.status!=="pagato"||(f&&f.planId===x.id));
  const split={}; let touched=false;
  const seed=amount=>{
    parts.forEach(x=>{ split[x.id]={on:true,amount:N(amount)*(N(x.quota)/qSum)} });
  };
  if(!isNew){
    const sp=paidSplit(f);
    parts.forEach(x=>{ split[x.id]={on:false,amount:0} });
    if(sp.length){ sp.forEach(x=>{ if(split[x.id]) split[x.id]={on:true,amount:x.amount} }); touched=true }
    else seed(f.amount);
  } else seed(0);

  const b=el("div");
  b.innerHTML=
    (!isReq&&openPlan.length?'<div class="field"><label for="x_plan">Collega a un pagamento previsto</label>'+
      '<select class="inp" id="x_plan"><option value="">— nessun collegamento —</option>'+
      openPlan.map(x=>'<option value="'+x.id+'"'+((f&&f.planId===x.id)?" selected":"")+'>'+
        esc((x.label||"Pagamento")+(x.supplier?" · "+x.supplier:"")+" · "+eurN(x.amount)+" · sett. "+fmtD(x.date))+
        '</option>').join("")+'</select>'+
      '<div class="dim" style="font-size:11.5px;margin-top:5px">Selezionandolo, importo e fornitore si compilano da soli.</div></div>':'')+
    '<div class="f2">'+fld("x_sup","Fornitore / impresa","text",f?f.supplier:"")+
      fld("x_amt","Importo €","number",f?f.amount:"",'step="0.01"')+'</div>'+
    fld("x_desc","Descrizione","text",f?f.desc:"")+
    '<div class="f2">'+fld("x_date",isReq?"Data richiesta":"Data pagamento","date",f?f.date:iso(new Date()))+
      (isReq?fld("x_due","Scadenza","date",f?f.due:"")
            :sel("x_meth","Modalità",f?f.method:"bonifico",METHODS))+'</div>'+
    '<div class="f2">'+
      (isReq?sel("x_st","Stato",f?f.status:"draft",FSTAT):'<div></div>')+
      sel("x_cat","Voce di costo",f?f.cat:"lavori",[["lavori","Lavori / cantiere"],["progetto","Progetto e permessi"],
        ["acquisto","Acquisto immobile"],["agenzia","Agenzia / commerciale"],["finanziari","Oneri finanziari"],["altro","Altro"]])+
    '</div>'+
    (!isReq?'<div class="pgrp"><div class="h"><span class="eyebrow">Chi ha pagato</span>'+
      '<button type="button" class="mini-link" id="sp_q">per quota</button>'+
      '<button type="button" class="mini-link" id="sp_e">parti uguali</button>'+
      '<button type="button" class="mini-link" id="sp_n">deseleziona</button></div>'+
      '<div id="spl"></div>'+
      '<div class="row" style="justify-content:space-between;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-2)">'+
      '<span class="eyebrow">Ripartito</span><span id="spsum" class="mono" style="font-size:12.5px;font-weight:700"></span></div>'+
      '</div>':'')+
    fld("x_note","Note","textarea",f?f.note:"")+
    (!isReq&&openPlan.length?'<label class="perm" id="x_mkw" style="margin-top:4px"><input type="checkbox" id="x_mk" checked>'+
      '<span class="t">Segna il pagamento previsto collegato come pagato</span></label>':'');

  const amtEl=$("#x_amt",b);
  const drawSplit=()=>{
    const host=$("#spl",b); if(!host) return;
    host.innerHTML="";
    if(!parts.length){ host.innerHTML='<div class="dim" style="font-size:12px">Nessun socio configurato: aggiungili dalla scheda progetto.</div>'; return }
    parts.forEach(x=>{
      const st=split[x.id]||(split[x.id]={on:false,amount:0});
      const row=el("div","srow");
      row.innerHTML='<label class="perm" style="min-width:0"><input type="checkbox" data-pt="'+x.id+'"'+(st.on?" checked":"")+'>'+
        '<span class="t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.name)+
        ' <span class="dim" style="font-weight:500">'+pct(N(x.quota),N(x.quota)%1?2:0)+'</span></span></label>'+
        '<input class="inp num" type="number" step="0.01" value="'+(st.on?Math.round(st.amount*100)/100:"")+'"'+(st.on?"":" disabled")+'>';
      const cb=$("input[data-pt]",row), am=$$("input",row)[1];
      cb.addEventListener("change",()=>{
        st.on=cb.checked; am.disabled=!cb.checked;
        if(cb.checked&&!N(am.value)) rebalance(); else { st.amount=N(am.value); sum() }
        drawSplit();
      });
      am.addEventListener("input",()=>{ touched=true; st.amount=N(am.value); sum() });
      host.appendChild(row);
    });
    sum();
  };
  const sum=()=>{
    const el2=$("#spsum",b); if(!el2) return;
    let t=0; parts.forEach(x=>{ if(split[x.id]&&split[x.id].on) t+=N(split[x.id].amount) });
    const tot=N(amtEl?amtEl.value:0);
    const d=t-tot;
    el2.innerHTML=eurN(t)+' di '+eurN(tot)+
      (Math.abs(d)>0.5?' <span style="color:'+(d>0?"var(--bad)":"var(--warn)")+'">('+(d>0?"+":"")+eurN(d)+')</span>'
                      :' <span style="color:var(--good)">✓</span>');
  };
  const rebalance=(mode)=>{
    const tot=N(amtEl?amtEl.value:0);
    const on=parts.filter(x=>split[x.id]&&split[x.id].on);
    if(!on.length) return;
    if(mode==="equal"){ on.forEach(x=>split[x.id].amount=tot/on.length) }
    else { const qs=on.reduce((s,x)=>s+N(x.quota),0)||on.length;
      on.forEach(x=>split[x.id].amount=tot*(N(x.quota)/qs)) }
    touched=false;
  };
  if(!isReq){
    drawSplit();
    const q=$("#sp_q",b); if(q) q.addEventListener("click",()=>{parts.forEach(x=>{if(!split[x.id])split[x.id]={on:true,amount:0};split[x.id].on=true});rebalance("quota");drawSplit()});
    const e2=$("#sp_e",b); if(e2) e2.addEventListener("click",()=>{parts.forEach(x=>{if(!split[x.id])split[x.id]={on:true,amount:0};split[x.id].on=true});rebalance("equal");drawSplit()});

/* ---------- 4. voci del Gantt collegate ai gruppi ---------- */
function sortedTasks(){ return S.tasks.slice().sort((a,b)=>N(a.order)-N(b.order)) }
function groupsOf(){ return sortedTasks().filter(t=>t.group) }
function groupOfTask(id){
  const l=sortedTasks(); let g="";
  for(const t of l){ if(t.group) g=t.id; if(t.id===id) return g }
  return "";
}
function orderInGroup(gid,excludeId){
  const l=sortedTasks().filter(t=>t.id!==excludeId);
  if(!l.length) return 1;
  if(!gid) return N(l[l.length-1].order)+1;
  const gi=l.findIndex(t=>t.id===gid);
  if(gi<0) return N(l[l.length-1].order)+1;
  let j=gi+1;
  while(j<l.length && !l[j].group) j++;
  const lastIn=l[j-1], next=l[j];
  return next ? (N(lastIn.order)+N(next.order))/2 : N(lastIn.order)+1;
}

function loanPlan(p){
  const C=N(p&&p.loanAmount);
  if(!C) return null;
  const annual=N(p.loanRate);
  const i=annual/100/12;
  const tot=Math.max(1,Math.round(N(p.loanMonths)||12));
  const grace=clamp(Math.round(N(p.loanGraceMonths)||0),0,Math.max(0,tot-1));
  const n=Math.max(1,tot-grace);
  const rataGrace=C*i;
  const rata=i>0?(C*i)/(1-Math.pow(1+i,-n)):C/n;
  const start=pd(p.loanStart||p.ganttStart||p.startDate)||new Date();
  const rows=[]; let res=C;
  for(let m=1;m<=tot;m++){
    const d=new Date(start); d.setMonth(d.getMonth()+m);
    const int=res*i;
    if(m<=grace){ rows.push({m:m,date:iso(d),rata:int,int:int,cap:0,res:res}) }
    else{ const cap=Math.min(res,rata-int); res=Math.max(0,res-cap);
      rows.push({m:m,date:iso(d),rata:int+cap,int:int,cap:cap,res:res}) }
  }
  const totInt=rows.reduce((s,r)=>s+r.int,0);
  const feeSetup=N(p.loanFeeSetup);
  const today=iso(new Date());
  let resToday=C, paidInt=0, mToday=0;
  rows.forEach(r=>{ if(r.date<=today){ resToday=r.res; paidInt+=r.int; mToday=r.m } });
  const exit=p.ganttEnd||p.endDate||"";
  const hold=clamp(Math.round(N(p.loanHoldMonths)||0),0,tot);
  let interestToExit=totInt, residualAtExit=0, monthsToExit=tot, holdSource="durata piena";
  if(hold>0){
    interestToExit=0; residualAtExit=C; monthsToExit=0; holdSource="mesi impostati";
    rows.forEach(r=>{ if(r.m<=hold){ interestToExit+=r.int; residualAtExit=r.res; monthsToExit=r.m } });
  } else if(exit){
    interestToExit=0; residualAtExit=C; monthsToExit=0; holdSource="exit prevista";
    rows.forEach(r=>{ if(r.date<=exit){ interestToExit+=r.int; residualAtExit=r.res; monthsToExit=r.m } });
  }
  const feeEarly=residualAtExit*N(p.loanFeeEarly)/100;
  return {C:C,annual:annual,i:i,tot:tot,grace:grace,n:n,rataGrace:rataGrace,rata:rata,rows:rows,
    totInt:totInt,feeSetup:feeSetup,earlyPct:N(p.loanFeeEarly),
    resToday:resToday,paidInt:paidInt,mToday:mToday,
    interestToExit:interestToExit,residualAtExit:residualAtExit,monthsToExit:monthsToExit,feeEarly:feeEarly,
    hold:hold,holdSource:holdSource,
    finCost:feeSetup+interestToExit+feeEarly,exit:exit};
}
function metrics(p,fin,tasks){
  fin=fin||[]; tasks=tasks||[];
  const paid=fin.filter(f=>f.kind==="payment").reduce((s,f)=>s+N(f.amount),0);
  const reqOpen=fin.filter(f=>f.kind==="request"&&f.status!=="paid").reduce((s,f)=>s+N(f.amount),0);
  const reqAll=fin.filter(f=>f.kind==="request").reduce((s,f)=>s+N(f.amount),0);
  const buy=N(p.purchasePrice), buyCosts=N(p.purchaseCosts), works=N(p.budgetWorks), other=N(p.otherCosts);
  const design=N(p.designCosts);
  const plannedCost=buy+buyCosts+works+design+other;
  const actualCost=buy+buyCosts+paid+design+other;
  const rev=revenueOf(p);
  const fee=feeOn(rev,p);
  const L=loanPlan(p);
  const finCost=L?L.finCost:0;
  const debt=L?L.C:0;
  const totalCost=plannedCost+finCost+fee;
  const equity=Math.max(0,totalCost-debt);
  const capital=equity;
  const grossP=rev-plannedCost-fee-finCost;
  const grossA=rev-actualCost-fee-finCost;
  const tx=(p.taxes)||{};
  const soc=p.entity==="societa";
  const rate=soc?(N(tx.ires||24)+N(tx.irap||3.9)):N(tx.pf||26);
  const taxes=Math.max(0,grossP)*rate/100;
  const netP=grossP-taxes;
  const roiG=capital?grossP/capital*100:0;
  const roiN=capital?netP/capital*100:0;
  const roiCost=totalCost?grossP/totalCost*100:0;
  return {paid:paid,reqOpen:reqOpen,reqAll:reqAll,buy:buy,buyCosts:buyCosts,works:works,other:other,design:design,
    plannedCost:plannedCost,actualCost:actualCost,rev:rev,fee:fee,capital:capital,totalCost:totalCost,
    loan:L,finCost:finCost,debt:debt,equity:equity,ltc:totalCost?debt/totalCost*100:0,
    gross:grossP,grossActual:grossA,taxRate:rate,taxes:taxes,net:netP,roiG:roiG,roiN:roiN,roiCost:roiCost,
    progress:progressOf(tasks),spentPct:works?paid/works*100:0};
}
function breakEven(p,m){
  let lo=0,hi=Math.max(1e5,(m.plannedCost+m.finCost)*3);
  for(let k=0;k<60;k++){ const mid=(lo+hi)/2; const g=mid-m.plannedCost-m.finCost-feeOn(mid,p); if(g<0) lo=mid; else hi=mid }
  return hi;
}

function keepScroll(host,key,R){
  const gr=$("#gr",host); if(!gr) return;
  const saved=S.scroll[key];
  let target=0;
  if(saved!=null&&saved>0) target=saved;
  else if(R){ const x=((new Date()-R.start)/DAY)/7*COL; target=Math.max(0,x-gr.clientWidth*0.35) }
  const attach=()=>{
    S.scroll[key]=gr.scrollLeft;
    gr.addEventListener("scroll",()=>{ S.scroll[key]=gr.scrollLeft },{passive:true});
  };
  if(target>0){
    gr.scrollLeft=target;
    requestAnimationFrame(()=>{ if(Math.abs(gr.scrollLeft-target)>1) gr.scrollLeft=target; attach() });
  } else attach();
}
function scrollToToday(root,R,key){
  const gr=$("#gr",root)||$("#gr");

  gr.scrollTo({left:to,behavior:"smooth"});
}

const GIORNI=["dom","lun","mar","mer","gio","ven","sab"];
function fmtDL(s){ const d=pd(s); if(!d) return "—"; return GIORNI[d.getDay()]+" "+fmtD(s) }
let _tip=null;
function tipEl(){
  if(_tip&&document.body.contains(_tip)) return _tip;
  _tip=el("div","gtip"); document.body.appendChild(_tip); return _tip;
}
function tipShow(html,ev){
  const t=tipEl(); t.innerHTML=html; t.classList.add("on"); tipMove(ev);
}
function tipMove(ev){
  const t=tipEl(); if(!t.classList.contains("on")) return;
  const r=t.getBoundingClientRect();
  let x=ev.clientX+16, y=ev.clientY+18;
  if(x+r.width>innerWidth-10) x=ev.clientX-r.width-16;
  if(y+r.height>innerHeight-10) y=ev.clientY-r.height-14;
  t.style.left=Math.max(8,x)+"px"; t.style.top=Math.max(8,y)+"px";
}
function tipHide(){ if(_tip) _tip.classList.remove("on") }
function tipRow(l,v,strong){
  return '<div class="r"><span>'+esc(l)+'</span><span'+(strong?' style="color:var(--accent)"':'')+'>'+esc(v)+'</span></div>';
}
function geomDates(bar,R){
  const left=parseFloat(bar.style.left)||0, w=parseFloat(bar.style.width)||COL;
  const wk=Math.max(1,Math.round(w/COL));
  const st=addD(R.start,Math.round(left/COL)*7);
  return {start:iso(st),end:iso(addD(st,wk*7-1)),weeks:wk};
}
function taskTip(t,bar,R,live){
  let st=t.start,en=t.end,wk;
  if(live){ const g=geomDates(bar,R); st=g.start; en=g.end; wk=g.weeks }
  else { const d=Math.round((pd(en)-pd(st))/DAY)+1; wk=Math.max(1,Math.round(d/7)) }
  const days=Math.round((pd(en)-pd(st))/DAY)+1;
  const c=catOf(t.cat);
  const today=iso(new Date());
  const stato=t.group?"":(N(t.progress)>=100?"completata":en<today?"in ritardo":st<=today&&en>=today?"in corso":"da avviare");
  const tone=stato==="in ritardo"?"var(--bad)":stato==="in corso"?"var(--accent)":stato==="completata"?"var(--good)":"";
  return '<div class="t"><i style="background:'+c.c+'"></i>'+esc(t.name)+'</div>'+
    (t.group?'<div class="r"><span>Gruppo del cronoprogramma</span></div>':
      tipRow("Inizio",fmtDL(st))+
      tipRow("Fine",fmtDL(en))+
      '<div class="sep"></div>'+
      tipRow("Durata",wk+(wk===1?" settimana":" settimane")+" · "+days+" gg",true)+
      tipRow("Avanzamento",Math.round(N(t.progress))+"%")+
      (canF("g_resp")&&t.resp?tipRow("Impresa",t.resp):"")+
      '<div class="sep"></div>'+
      '<div class="r"><span>'+esc(c.n)+'</span><span style="color:'+(tone||"var(--side-ink-2)")+'">'+esc(stato)+'</span></div>'+
      (live?'<div class="r" style="margin-top:4px"><span style="color:var(--accent)">rilascia per confermare</span></div>':''));
}
function payTip(it,bar,R,live,p){
  let date=it.date, wk=Math.max(1,N(it.weeks)||1);
  if(live){ const g=geomDates(bar,R); date=g.start; wk=g.weeks }
  const who=(p&&p.partners||[]).find(x=>x.id===it.paidBy);
  const c=it.status==="pagato"?"#3C7A57":it.status==="confermato"?"#C4712B":"#6E7D8C";
  const fine=iso(addD(pd(date)||new Date(),wk*7-1));
  return '<div class="t"><i style="background:'+c+'"></i>'+esc(it.label||it.supplier||"Pagamento")+'</div>'+
    (it.supplier?tipRow("Fornitore",it.supplier):"")+
    tipRow("Importo",VE(it.amount),true)+
    '<div class="sep"></div>'+
    tipRow("Settimana",fmtDL(date))+
    (wk>1?tipRow("Fine",fmtDL(fine)):"")+
    tipRow("Durata",wk+(wk===1?" settimana":" settimane"))+
    '<div class="sep"></div>'+
    tipRow("A carico di",who?who.name:"tutti i soci su quota")+
    '<div class="r"><span>Stato</span><span>'+esc(pstatLabel(it.status))+'</span></div>'+
    (live?'<div class="r" style="margin-top:4px"><span style="color:var(--accent)">rilascia per confermare</span></div>':'');
}
function ganttRow(t,idx,R,W,grid){
  const isG=t.group;
  let bar="";
  if(t.start&&t.end){
    const x=((pd(t.start)-R.start)/DAY)/7*COL;
    const w=Math.max(COL*0.7,(((pd(t.end)-pd(t.start))/DAY)+1)/7*COL);
    const c=catOf(t.cat).c; const pg=clamp(N(t.progress),0,100);
    bar='<div class="g-bar'+(isG?" gp":"")+(!isG&&w>118?" haspg":"")+'" data-bar="'+t.id+
      '" style="left:'+x+'px;width:'+w+'px;background-color:'+c+'">'+
      (pg>0?'<span class="fill" style="width:'+pg+'%"></span>':'')+
      '<span class="lab">'+esc(t.name)+'</span>'+
      (!isG&&w>118?'<span class="pgn">'+Math.round(pg)+'%</span>':'')+
      (canWrite()&&!isG?'<span class="rz l"></span><span class="rz r"></span>':'')+'</div>';
  }
  void idx;
  return '<div class="g-row'+(isG?" grp":"")+'" style="width:'+W+'px"><div class="g-track" style="width:'+W+'px">'+
    '<div class="g-grid">'+grid+'</div>'+bar+'</div></div>';
}
function bindGanttRows(host,R,W,p){
  $$("[data-ed]",host).forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
    const t=S.tasks.find(x=>x.id===b.dataset.ed); if(t) taskModal(t,t.group)}));
  $$("[data-rm]",host).forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
    const t=S.tasks.find(x=>x.id===b.dataset.rm); if(!t)return;
    confirmBox("Elimina voce","Eliminare «"+t.name+"» dal cronoprogramma?","Elimina",async()=>{
      await del(ppath("tasks/"+t.id)); await loadProjectData(S.pid); await syncProgress(p); render(); toast("Voce eliminata")})}));
  $$(".g-bar",host).forEach(bar=>{
    const id=bar.dataset.bar; const t=S.tasks.find(x=>x.id===id); if(!t) return;
    let mode=null,sx=0,ox=0,ow=0,moved=false;
    bar.addEventListener("pointerenter",ev=>{ if(!mode) tipShow(taskTip(t,bar,R,false),ev) });
    bar.addEventListener("pointermove",ev=>{ if(!mode) tipMove(ev) });
    bar.addEventListener("pointerleave",()=>{ if(!mode) tipHide() });
    if(!canWrite()||t.group) return;
    const down=ev=>{
      if(ev.button!=null&&ev.button!==0) return;
      mode=ev.target.classList.contains("rz")?(ev.target.classList.contains("l")?"l":"r"):"move";
      sx=ev.clientX; ox=parseFloat(bar.style.left); ow=parseFloat(bar.style.width); moved=false;
      bar.classList.add("drag"); bar.setPointerCapture&&bar.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    };
    const move=ev=>{
      if(!mode) return;
      const dx=ev.clientX-sx; const steps=Math.round(dx/COL);
      if(Math.abs(dx)>3) moved=true;
      if(mode==="move"){ bar.style.left=Math.max(0,ox+steps*COL)+"px" }
      else if(mode==="r"){ bar.style.width=Math.max(COL,ow+steps*COL)+"px" }
      else { const nl=Math.max(0,ox+steps*COL); const nw=Math.max(COL,ow-(nl-ox)); bar.style.left=nl+"px"; bar.style.width=nw+"px" }
      tipShow(taskTip(t,bar,R,true),ev);
    };
    const up=async ev=>{
      if(!mode) return; mode=null; bar.classList.remove("drag"); tipHide();
      if(!moved) return;
      const g=geomDates(bar,R);
      const data={start:g.start,end:g.end};
      Object.assign(t,data);
      await patch(ppath("tasks/"+t.id),data);
      await syncProgress(p);
      render();
      toast(t.name+" · "+fmtD(data.start)+" → "+fmtD(data.end)+" · "+g.weeks+" sett.");
      void ev;
    };
    bar.addEventListener("pointerdown",down);
    bar.addEventListener("pointermove",move);
    bar.addEventListener("pointerup",up);
    bar.addEventListener("pointercancel",()=>{mode=null;bar.classList.remove("drag");tipHide()});
    bar.addEventListener("dblclick",()=>{tipHide();taskModal(t,false)});
  });
  void W;
}
function bindPayTips(host,R,p){
  $$(".pay-bar",host).forEach(bar=>{
    const it=S.plan.find(x=>x.id===bar.dataset.pb); if(!it) return;
    let dragging=false;
    bar.addEventListener("pointerenter",ev=>{ if(!dragging) tipShow(payTip(it,bar,R,false,p),ev) });
    bar.addEventListener("pointermove",ev=>{
      if(bar.classList.contains("drag")){ dragging=true; tipShow(payTip(it,bar,R,true,p),ev) }
      else tipMove(ev);
    });
    bar.addEventListener("pointerleave",()=>{ dragging=false; tipHide() });
    bar.addEventListener("pointerup",()=>{ dragging=false; tipHide() });
    bar.addEventListener("pointercancel",()=>{ dragging=false; tipHide() });
  });
}


/* ======================================================================
   v8 — spaccato conti tra soci in stile Splitwise
   ====================================================================== */
const nameOf=(p,id)=>{ const x=((p&&p.partners)||[]).find(z=>z.id===id); return x?x.name:"—" };
function settlements(rows){
  const cred=rows.filter(r=>r.balance>0.5).map(r=>({id:r.id,name:r.name,v:r.balance})).sort((a,b)=>b.v-a.v);
  const deb=rows.filter(r=>r.balance<-0.5).map(r=>({id:r.id,name:r.name,v:-r.balance})).sort((a,b)=>b.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<deb.length&&j<cred.length){
    const amt=Math.min(deb[i].v,cred[j].v);
    if(amt>0.5) out.push({from:deb[i].id,fromName:deb[i].name,to:cred[j].id,toName:cred[j].name,amount:amt});
    deb[i].v-=amt; cred[j].v-=amt;
    if(deb[i].v<=0.5) i++;
    if(cred[j].v<=0.5) j++;
  }
  return out;
}
function socioMovements(p,sid){
  const parts=(p.partners||[]);
  const qSum=parts.reduce((s,x)=>s+N(x.quota),0)||100;
  const me=parts.find(x=>x.id===sid); if(!me) return [];
  const q=N(me.quota)/qSum;
  const out=[];
  (S.fin||[]).filter(f=>f.kind==="payment").forEach(f=>{
    const mine=paidByOf(f,sid);
    const due=N(f.amount)*q;
    if(Math.abs(mine)<0.005&&Math.abs(due)<0.005) return;
    out.push({date:f.date||"",kind:"pay",title:(f.supplier||f.desc||"Pagamento"),desc:f.desc||"",
      total:N(f.amount),mine:mine,due:due,eff:mine-due,payers:paidSplit(f)});
  });
  (S.ledger||[]).forEach(l=>{
    const isSettle=l.kind==="settle";
    if(l.from===sid) out.push({date:l.date||"",kind:isSettle?"settle-out":"led-out",
      title:isSettle?("Rimborso a "+nameOf(p,l.to)):("Anticipo per "+nameOf(p,l.to)),
      desc:l.desc||"",total:N(l.amount),mine:N(l.amount),due:0,eff:N(l.amount)});
    else if(l.to===sid) out.push({date:l.date||"",kind:isSettle?"settle-in":"led-in",
      title:isSettle?("Rimborso da "+nameOf(p,l.from)):("Anticipo ricevuto da "+nameOf(p,l.from)),
      desc:l.desc||"",total:N(l.amount),mine:0,due:N(l.amount),eff:-N(l.amount)});
  });
  return out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function mvLine(p,m,sid){
  const pos=m.eff>=0;
  let spiega="";
  if(m.kind==="pay"){
    const altri=(m.payers||[]).filter(x=>x.id!==sid);
    if(m.mine>0.005&&m.eff>0.5)
      spiega="Hai pagato "+VE(m.mine)+" · la tua quota era "+VE(m.due)+" → hai anticipato "+VE(m.eff)+" per gli altri soci.";
    else if(m.mine>0.005&&m.eff<-0.5)
      spiega="Hai pagato "+VE(m.mine)+" ma la tua quota era "+VE(m.due)+" → devi ancora "+VE(-m.eff)+".";
    else if(m.mine>0.005)
      spiega="Hai pagato esattamente la tua quota ("+VE(m.due)+").";
    else
      spiega="Pagato da "+(altri.length?altri.map(x=>nameOf(p,x.id)).join(", "):"altri")+
        " · la tua quota su "+VE(m.total)+" è "+VE(m.due)+" → sei in debito di "+VE(m.due)+".";
  } else if(m.kind==="led-out") spiega="Hai anticipato "+VE(m.total)+" per suo conto → te li deve restituire.";
  else if(m.kind==="led-in") spiega="Ha anticipato "+VE(m.total)+" per te → glieli devi restituire.";
  else if(m.kind==="settle-out") spiega="Hai rimborsato "+VE(m.total)+" → il conto si chiude di pari importo.";
  else spiega="Hai ricevuto "+VE(m.total)+" a saldo → il conto si chiude di pari importo.";
  return '<div class="mv">'+
    '<div class="mv-h"><span class="mv-d">'+fmtD(m.date)+'</span>'+
      '<span class="mv-t">'+esc(m.title)+'</span>'+
      '<span class="mv-e" style="color:'+(pos?"var(--good)":"var(--bad)")+'">'+(pos?"+":"−")+VE(Math.abs(m.eff))+'</span></div>'+
    '<div class="mv-b">'+esc(spiega)+(m.desc&&m.kind==="pay"?' <span class="dim">· '+esc(m.desc)+'</span>':'')+'</div>'+
    '</div>';
}

/* ======================================================================
   v9 — export Excel della timeline pagamenti (xlsx nativo, senza librerie)
   ====================================================================== */
const _crcT=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0} return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++) c=_crcT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder();
  const parts=[],central=[];let off=0;
  files.forEach(f=>{
    const name=enc.encode(f.name);
    const data=typeof f.data==="string"?enc.encode(f.data):f.data;
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0x2100,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x2100,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  });
  let cs=0; central.forEach(x=>cs+=x.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cs,true); eo.setUint32(16,off,true); eo.setUint16(20,0,true);
  const all=parts.concat(central,[new Uint8Array(eo.buffer)]);
  let tot=0; all.forEach(x=>tot+=x.length);
  const out=new Uint8Array(tot); let q=0; all.forEach(x=>{out.set(x,q);q+=x.length});
  return new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function inflateRaw(src){
  let bp=0, bb=0, bc=0, ip=0;

  const back=d=>ol>=d?ob[ol-d]:(function(){ let need=d-ol, i=out.length-1;
      while(i>=0){ if(need<=out[i].length) return out[i][out[i].length-need]; need-=out[i].length; i-- }
      throw new Error("dist") })();
  const bits=n=>{ while(bc<n){ bb|=src[ip++]<<bc; bc+=8 } const v=bb&((1<<n)-1); bb>>>=n; bc-=n; return v };
  function buildTree(lens){
    const maxBits=Math.max.apply(null,Array.from(lens));
    const blCount=new Array(maxBits+1).fill(0);
    lens.forEach(l=>{ if(l) blCount[l]++ });
    const nextCode=new Array(maxBits+1).fill(0); let code=0;
    for(let b=1;b<=maxBits;b++){ code=(code+blCount[b-1])<<1; nextCode[b]=code }
    const map={};
    for(let i=0;i<lens.length;i++){ const l=lens[i]; if(!l) continue; map[l+":"+(nextCode[l]++)]=i }

function unzipEntries(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);

  const dec=new TextDecoder(); const files={};
  for(let k=0;k<n;k++){

    const name=dec.decode(u8.subarray(off+46,off+46+nlen));
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    const start=lho+30+lnlen+lelen;
    const raw=u8.subarray(start,start+csize);
    files[name]=method===0?raw:inflateRaw(raw);
    off+=46+nlen+elen+clen;
  }
  return files;
}

async function renderPdfPage(doc,n,canvas,targetW){

async function readSheet(f){

  const dec=new TextDecoder();
  const get=n=>files[n]?dec.decode(files[n]):null;
  const P=new DOMParser();
  const ss=[];
  const sst=get("xl/sharedStrings.xml");
  if(sst){ const d=P.parseFromString(sst,"application/xml");
    Array.from(d.getElementsByTagName("si")).forEach(si=>{
      let t=""; Array.from(si.getElementsByTagName("t")).forEach(x=>t+=x.textContent); ss.push(t) }) }
  let names=[];
  const wbx=get("xl/workbook.xml");
  if(wbx){ const d=P.parseFromString(wbx,"application/xml");
    names=Array.from(d.getElementsByTagName("sheet")).map(x=>x.getAttribute("name")) }
  const key=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k))
    .sort((a,b)=>N(a.replace(/\D/g,""))-N(b.replace(/\D/g,"")))[0];
  if(!key) throw new Error("nosheet");
  const d=P.parseFromString(get(key),"application/xml");
  const rows=[];
  const rEls=Array.from(d.getElementsByTagName("row")).slice(0,40);
  rEls.forEach(r=>{
    const out=[];
    Array.from(r.getElementsByTagName("c")).forEach(c=>{
      const ref=c.getAttribute("r")||""; const ci=Math.max(0,colIdx(ref));
      if(ci>17) return;
      const t=c.getAttribute("t");
      let v="";
      if(t==="inlineStr"){ const is=c.getElementsByTagName("t")[0]; v=is?is.textContent:"" }
      else { const ve=c.getElementsByTagName("v")[0]; const raw=ve?ve.textContent:"";

        else if(raw!==""){ const num=parseFloat(raw);

  });

}

  }

async function uploadFiles(list,p,opts){
  opts=opts||{};
  if(!canWrite()){toast("Non hai i permessi per caricare file",true);return}
  const folder=opts.folder||S.folder;
  const batch=opts.batch||uid("bt");
  const note=opts.note||"";
  const at=new Date().toISOString();
  let ok=0;
  toast("Carico "+list.length+(list.length===1?" file…":" file…"));
  for(const file of list){
    const ex=extOf(file.name);
    const type=ASSET_TYPES[ex];
    const id=uid("fl");
    const base={name:file.name,size:file.size,folder:folder,at:at,by:S.me.id,batch:batch,batchNote:note};
    try{
      if(type&&S.assets){
        const r=await S.assets.upload(file,{type:type});
        await put(ppath("files/"+id),Object.assign({},base,{size:r.sizeBytes||file.size,assetId:r.id,mime:type}));
      }else{
        if(file.size>2200000){ toast(file.name+": troppo grande per questo formato (max 2 MB)",true); continue }
        const buf=await file.arrayBuffer();
        let bin=""; const u8=new Uint8Array(buf);
        for(let i=0;i<u8.length;i+=8192) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));

        await put(ppath("files/"+id),Object.assign({},base,{chunks:n}));
      }
      ok++;
    }catch(e){ toast(file.name+": caricamento non riuscito"+(e&&e.code?" ("+e.code+")":""),true) }
  }
  if(ok) await patch("projects/"+p.id,{lastDocAt:at,lastDocBy:S.me.id,

function docGroups(files){
  const map={},order=[];
  files.forEach(f=>{
    const k=f.batch?("b:"+f.batch):("s:"+f.id);
    if(!map[k]){ map[k]={key:k,note:f.batchNote||"",at:f.at||"",by:f.by,files:[]}; order.push(k) }
    map[k].files.push(f);
    if(String(f.at||"")>map[k].at) map[k].at=f.at;
  });
  return order.map(k=>map[k]).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}

const SEP=" / ";
const parentOf=f=>f.indexOf(SEP)>=0?f.slice(0,f.indexOf(SEP)):"";
const leafOf=f=>f.indexOf(SEP)>=0?f.slice(f.indexOf(SEP)+SEP.length):f;
function canFolder(name){
  if(isMaster()) return true;
  const f=S.me&&S.me.perms&&S.me.perms.folders;
  if(!f||f==="all") return true;
  if(f.indexOf(name)>=0) return true;
  const par=parentOf(name);
  return !!par&&f.indexOf(par)>=0;
}
function orderFolders(list){
  const roots=list.filter(f=>!parentOf(f));
  const out=[];
  roots.forEach(r=>{ out.push(r);
    list.filter(f=>parentOf(f)===r).sort((a,b)=>leafOf(a).localeCompare(leafOf(b))).forEach(c=>out.push(c)) });
  list.filter(f=>parentOf(f)&&roots.indexOf(parentOf(f))<0).forEach(f=>out.push(f));
  return out;
}
function subFolders(list,parent){ return list.filter(f=>parentOf(f)===parent).map(leafOf) }

async function uploadFiles(items,p,opts){
  opts=opts||{};
  if(!canWrite()){toast("Non hai i permessi per caricare file",true);return}
  const folder=opts.folder||S.folder;
  const batch=opts.batch||uid("bt");
  const at=new Date().toISOString();
  let ok=0;
  toast("Carico "+items.length+" file…");
  for(const it of items){
    let file=it.file||it;
    if(/^image\//.test(file.type)) file=await shrinkImage(file,1800,0.82);
    const ex=extOf(file.name);
    const nm=withExt((it.name||file.name||"").trim()||file.name,ex);
    const type=ASSET_TYPES[ex];
    const id=uid("fl");
    const base={name:nm,ext:ex,desc:(it.desc||"").trim(),size:file.size,folder:folder,at:at,
      by:S.me.id,batch:batch,batchNote:opts.note||""};
    try{
      if(type&&S.assets){
        const r=await S.assets.upload(file,{type:type});
        await put(ppath("files/"+id),Object.assign({},base,{size:r.sizeBytes||file.size,assetId:r.id,mime:type}));
      }else{
        if(file.size>9000000){ toast(nm+": troppo grande (massimo 9 MB per file)",true); continue }
        const buf=await file.arrayBuffer();
        let bin=""; const u8=new Uint8Array(buf);
        for(let i=0;i<u8.length;i+=8192) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
        const b64=btoa(bin);
        const n=Math.ceil(b64.length/CHUNK);
        for(let i=0;i<n;i++) await put(ppath("blobs/"+id+"_"+i),{d:b64.slice(i*CHUNK,(i+1)*CHUNK)});
        await put(ppath("files/"+id),Object.assign({},base,{chunks:n}));
      }
      ok++;
    }catch(e){ toast(nm+": caricamento non riuscito"+(e&&e.code?" ("+e.code+")":""),true) }
  }
  if(ok) await patch("projects/"+p.id,{lastDocAt:at,lastDocBy:S.me.id,
    lastDocName:opts.note||(items[0]?String(items[0].name||items[0].file.name).slice(0,60):"")});
  await loadProjects(); await loadProjectData(S.pid); render();
  toast(ok+(ok===1?" file caricato":" file caricati")+(opts.note?" in "+opts.note:""));
}

function fsAdapter(fs){
  const D=path=>({
    id:path.split("/").pop(), path:path,
    get:async()=>{ const s=await fs.doc(path).get(); return {id:s.id,exists:s.exists,data:()=>s.data()} },
    set:d=>fs.doc(path).set(d),
    update:d=>fs.doc(path).set(d,{merge:true}),
    delete:()=>fs.doc(path).delete(),
    collection:sub=>C(path+"/"+sub)
  });
  const C=path=>({
    path:path,
    get:async()=>{ const q=await fs.collection(path).get();
      return {docs:q.docs.map(x=>({id:x.id,exists:true,data:()=>x.data()})),size:q.size,empty:q.empty} },
    doc:id=>D(path+"/"+(id||fs.collection(path).doc().id))
  });
  return {doc:D,collection:C};
}
function saveBlob(filename,data){
  const blob=data instanceof Blob?data:new Blob([data],{type:"application/octet-stream"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url) },1500);
  return {status:"saved"};
}
async function boot(){
  if(typeof firebase==="undefined"||!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey){
    S.dbFail=true; renderFail("Configurazione Firebase mancante",
      "Apri il file <b>firebase-config.js</b> e incolla i dati del tuo progetto Firebase."); return;
  }
  try{
    FB=firebase.initializeApp(window.FIREBASE_CONFIG);
    FBAUTH=firebase.auth(); FBDB=firebase.firestore();
    try{ await FBAUTH.setPersistence(firebase.auth.Auth.Persistence.LOCAL) }catch(e){}
  }catch(e){ S.dbFail=true; renderFail("Firebase non raggiungibile",esc(e&&e.message||"")); return }
  S.db=fsAdapter(FBDB);
  S.assets=null;
  S.dl={save:async r=>saveBlob(r.filename,r.data)};
  FBAUTH.onAuthStateChanged(async u=>{
    if(!u){ S.me=null; S.ready=true; render(); return }
    try{
      const snap=await FBDB.collection("accounts").doc(u.uid).get();
      if(!snap.exists){
        if(String(u.email||"").toLowerCase()===ADMIN_EMAIL){
          const me={name:u.displayName||"Amministratore",email:u.email,role:"master",
            roleLabel:"AMMINISTRATORE",active:true,createdAt:new Date().toISOString()};
          await FBDB.collection("accounts").doc(u.uid).set(me);
          S.me=Object.assign({id:u.uid},me);
        } else {
          await FBAUTH.signOut();
          S.ready=true; render();
          setTimeout(()=>toast("Account non abilitato: chiedi all'amministratore di creare il tuo profilo",true),300);
          return;
        }
      } else {
        const d=snap.data();
        if(d.active===false){ await FBAUTH.signOut(); S.ready=true; render();
          setTimeout(()=>toast("Account disattivato",true),300); return }
        S.me=Object.assign({id:u.uid},d);
      }
      await loadAccounts(); await loadProjects();
      S.ready=true; await afterLogin(true);
    }catch(e){
      S.ready=true; S.me=null; render();
      setTimeout(()=>toast("Accesso non riuscito: "+(e&&e.message||"errore"),true),300);
    }
  });
}
function renderFail(titolo,testo){
  $("#root").innerHTML='<div id="gate"><div class="gate-card">'+
    '<div class="mark"><div class="mark-glyph">RE</div><div><div class="mark-name">REAL ESTATE PJT</div>'+
    '<div class="mark-sub">Operazioni immobiliari</div></div></div>'+
    '<h3 style="font-size:16px;margin-bottom:8px">'+esc(titolo||"Archivio non disponibile")+'</h3>'+
    '<p class="muted" style="font-size:13px">'+(testo||"Ricarica la pagina e riprova.")+'</p></div></div>';
}
async function tryLogin(email,pass,errBox){
  email=String(email||"").trim().toLowerCase();
  if(!email||!pass){ errBox("Inserisci email e password."); return }
  try{ await FBAUTH.signInWithEmailAndPassword(email,pass) }
  catch(e){
    const c=e&&e.code||"";
    errBox(c==="auth/invalid-email"?"Indirizzo email non valido."
      :c==="auth/too-many-requests"?"Troppi tentativi: riprova tra qualche minuto."
      :c==="auth/network-request-failed"?"Connessione assente."
      :"Credenziali non valide.");
  }
}
function logout(){ S.me=null; lsDel("repjt.sess"); if(FBAUTH) FBAUTH.signOut(); S.view="projects"; render() }
async function loadAccounts(){
  try{ const q=await FBDB.collection("accounts").get();
    S.accounts=q.docs.map(d=>Object.assign({id:d.id},d.data()));
  }catch(e){ S.accounts=S.me?[S.me]:[] }
}
function renderGate(){
  const r=$("#root");
  r.innerHTML='<div id="gate"><form class="gate-card" id="lf" autocomplete="on">'+
    '<div class="mark"><div class="mark-glyph">RE</div><div><div class="mark-name">REAL ESTATE PJT</div>'+
    '<div class="mark-sub">Compro · Ristrutturo · Vendo</div></div></div>'+
    '<h3 style="font-size:17px;margin-bottom:4px">Accedi alla piattaforma</h3>'+
    '<p class="muted" style="font-size:12.5px;margin-bottom:20px">Gestione integrata delle operazioni immobiliari.</p>'+
    '<div class="field"><label for="li_email">Email</label><input class="inp" id="li_email" type="email" data-nocase autocomplete="username" placeholder="nome@dominio.it"></div>'+
    '<div class="field"><label for="li_pass">Password</label><input class="inp" id="li_pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>'+
    '<button class="btn btn-pri btn-w" type="submit" id="li_go" style="margin-top:8px">Entra</button>'+
    '<div id="li_err" class="gate-err hide"></div>'+
    '<div class="gate-foot"><button type="button" class="mini-link" id="li_reset">Ho dimenticato la password</button>'+
    '<br>Accesso riservato. Le credenziali sono gestite dall\'amministratore.</div>'+
    '</form></div>';
  const err=m=>{const b=$("#li_err");b.textContent=m;b.classList.remove("hide")};
  $("#lf").addEventListener("submit",async ev=>{
    ev.preventDefault(); $("#li_err").classList.add("hide");
    const b=$("#li_go"); b.disabled=true; b.textContent="Verifica…";
    await tryLogin($("#li_email").value,$("#li_pass").value,err);
    if($("#li_go")){ b.disabled=false; b.textContent="Entra" }
  });
  $("#li_reset").addEventListener("click",async()=>{
    const em=String($("#li_email").value||"").trim().toLowerCase();
    if(!em){ err("Scrivi prima la tua email, poi premi di nuovo."); return }
    try{ await FBAUTH.sendPasswordResetEmail(em); toast("Email di reimpostazione inviata a "+em) }
    catch(e){ err("Non è stato possibile inviare l'email di reimpostazione.") }
  });
  setTimeout(()=>{const e=$("#li_email");if(e)e.focus()},60);
}
/* ---- creazione utenti senza perdere la sessione dell'amministratore ---- */
async function createAuthUser(email,pass){
  if(!FBSECOND) FBSECOND=firebase.initializeApp(window.FIREBASE_CONFIG,"admin-worker");
  const a2=FBSECOND.auth();
  const cred=await a2.createUserWithEmailAndPassword(email,pass);
  const uid=cred.user.uid;
  await a2.signOut();
  return uid;
}
/* ---- compressione immagini prima del caricamento ---- */
async function shrinkImage(file,maxPx,quality){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try{
    const bmp=await createImageBitmap(file);
    const scale=Math.min(1,maxPx/Math.max(bmp.width,bmp.height));
    if(scale>=1&&file.size<600000) return file;
    const w=Math.round(bmp.width*scale), h=Math.round(bmp.height*scale);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",quality||0.82));
    if(!blob||blob.size>=file.size) return file;
    const nn=file.name.replace(/\.(png|webp|jpeg|jpg)$/i,"")+".jpg";
    return new File([blob],nn,{type:"image/jpeg"});
  }catch(e){ return file }
}


/* ---------- importazione dei dati esportati dall'artifact ---------- */
function importModal(){
  const b=el("div");
  b.innerHTML='<p class="muted" style="font-size:13px;margin-bottom:12px">Carica il file '+
    '<b>migrazione-dati.json</b>. Prima di importare, crea i profili degli utenti elencati: '+
    'i riferimenti (soci, chi ha pagato, chi ha caricato) vengono ricollegati tramite l\'email.</p>'+
    '<input type="file" id="im_f" accept="application/json,.json" class="inp">'+
    '<div id="im_rep" style="margin-top:14px"></div>';
  let seed=null;
  const mo=modal({title:"Importa dati",wide:true,body:b,ok:"Importa",onOk:async()=>{
    if(!seed){ toast("Scegli prima il file",true); return false }
    const btn=$(".modal [data-ok]"); if(btn) btn.textContent="Importo…";
    try{ await runImport(seed); toast("Importazione completata"); return true }
    catch(e){ toast("Importazione non riuscita: "+(e&&e.message||"errore"),true); return false }
  }});
  $("#im_f",b).addEventListener("change",async()=>{
    const f=$("#im_f",b).files[0]; if(!f) return;
    try{
      seed=JSON.parse(await f.text());
      const rows=(seed.users||[]).map(u=>{
        const a=S.accounts.find(x=>String(x.email||"").toLowerCase()===String(u.email||"").toLowerCase());
        return '<div class="split"><span class="l">'+esc(u.name||u.email)+' <span class="dim">'+esc(u.email)+'</span></span>'+
          '<span class="v">'+(a?'<span class="chip good">collegato</span>':'<span class="chip bad">profilo mancante</span>')+'</span></div>';
      }).join("");
      const np=(seed.projects||[]).length;
      const miss=(seed.users||[]).filter(u=>!S.accounts.some(x=>String(x.email||"").toLowerCase()===String(u.email||"").toLowerCase())).length;
      $("#im_rep",b).innerHTML='<div class="eyebrow" style="margin-bottom:8px">Utenti nel file</div>'+rows+
        '<div class="split tot"><span class="l">Operazioni da importare</span><span class="v">'+np+'</span></div>'+
        (miss?'<p class="dim" style="font-size:11.5px;margin-top:10px"><b style="color:var(--warn)">'+miss+
          ' profili non esistono ancora</b>: puoi importare comunque, ma i riferimenti a quelle persone resteranno scollegati '+
          'finché non crei il profilo con la stessa email e reimporti.</p>':'');
    }catch(e){ $("#im_rep",b).innerHTML='<div class="gate-err">File non valido: '+esc(e.message||"")+'</div>'; seed=null }
  });
  void mo;
}
async function runImport(seed){
  const map={};
  (seed.users||[]).forEach(u=>{
    const a=S.accounts.find(x=>String(x.email||"").toLowerCase()===String(u.email||"").toLowerCase());
    if(a) map[u.legacyId]=a.id;
  });
  const fix=id=>(id&&map[id])?map[id]:id;
  for(const pr of (seed.projects||[])){
    const d=Object.assign({},pr.data);
    d.createdBy=fix(d.createdBy); d.lastDocBy=fix(d.lastDocBy);
    d.partners=(d.partners||[]).map(x=>Object.assign({},x,{accountId:fix(x.accountId)}));
    delete d.id;
    await put("projects/"+pr.id,d);
    for(const t of (pr.tasks||[])){ const x=Object.assign({},t); const id=x.id; delete x.id;
      await put("projects/"+pr.id+"/tasks/"+id,x) }
    for(const t of (pr.plan||[])){ const x=Object.assign({},t); const id=x.id; delete x.id;
      x.paidBy=fix(x.paidBy); x.by=fix(x.by);
      await put("projects/"+pr.id+"/plan/"+id,x) }
    for(const t of (pr.fin||[])){ const x=Object.assign({},t); const id=x.id; delete x.id;
      x.by=fix(x.by); x.paidBy=fix(x.paidBy);
      if(Array.isArray(x.paidByList)) x.paidByList=x.paidByList.map(y=>Object.assign({},y,{id:fix(y.id)}));
      await put("projects/"+pr.id+"/fin/"+id,x) }
    for(const t of (pr.ledger||[])){ const x=Object.assign({},t); const id=x.id; delete x.id;
      x.from=fix(x.from); x.to=fix(x.to); x.by=fix(x.by);
      await put("projects/"+pr.id+"/ledger/"+id,x) }
    for(const t of (pr.files||[])){ const x=Object.assign({},t); const id=x.id; delete x.id;
      x.by=fix(x.by);
      await put("projects/"+pr.id+"/files/"+id,x) }
    const bl=pr.blobs||{};
    for(const k of Object.keys(bl)) await put("projects/"+pr.id+"/blobs/"+k,{d:bl[k]});
  }
  await loadProjects(); if(S.pid) await loadProjectData(S.pid); render();
}


/* ---------- backup completo (solo amministratore) ---------- */
async function exportBackup(){
  toast("Preparo il backup…");
  const pull=async(path)=>{ try{ const q=await S.db.collection(path).get();
    return q.docs.map(d=>Object.assign({id:d.id},d.data())) }catch(e){ return [] } };
  const accs=await pull("accounts");
  const prjs=await pull("projects");
  const out={version:1,exportedAt:new Date().toISOString(),
    users:accs.map(a=>({legacyId:a.id,email:a.email||"",name:a.name||"",roleLabel:a.roleLabel||"UTENTE",
      role:a.role||"user",active:a.active!==false,perms:a.perms||{}})),
    projects:[]};
  for(const p of prjs){
    const pid=p.id; const d=Object.assign({},p); delete d.id;
    const [tasks,plan,fin,ledger,files,blobsArr]=await Promise.all([
      pull("projects/"+pid+"/tasks"),pull("projects/"+pid+"/plan"),pull("projects/"+pid+"/fin"),
      pull("projects/"+pid+"/ledger"),pull("projects/"+pid+"/files"),pull("projects/"+pid+"/blobs")]);
    const blobs={}; blobsArr.forEach(x=>{ blobs[x.id]=x.d||"" });
    out.projects.push({id:pid,data:d,tasks:tasks,plan:plan,fin:fin,ledger:ledger,files:files,blobs:blobs});
  }
  const json=JSON.stringify(out);
  saveBlob("backup-real-estate-pjt-"+iso(new Date())+".json",new Blob([json],{type:"application/json"}));
  toast("Backup scaricato · "+sizeStr(json.length));
}
